services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: "dev_root_password_change_me"
      MYSQL_DATABASE: "rezervfitness_db"
      MYSQL_USER: "rezerv_app"
      MYSQL_PASSWORD: "dev_app_password_change_me"
    ports:
      - "3307:3306"
    volumes:
      - "rezerv_mysql_data:/var/lib/mysql"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - "rezerv_redis_data:/data"
    command:
      - redis-server
      - --appendonly
      - "yes"

volumes:
  rezerv_mysql_data:
  rezerv_redis_data: